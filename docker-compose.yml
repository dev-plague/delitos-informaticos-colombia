name: delitos

# Pipeline de datos: datos.gov.co -> JSONL -> Kafka -> HDFS -> PySpark/Parquet
# -> PostgreSQL -> Streamlit.  Toda la plataforma corre en Docker (Linux).
#
# Puertos en el host:
#   8501  Tablero Streamlit
#   8888  JupyterLab (notebook del proyecto)
#   9870  NameNode Web UI
#   9000  HDFS RPC
#   9092  Kafka (solo desde la red interna; se publica por comodidad)
#   5435  PostgreSQL (la zona de servicio)

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: delitos-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks: [delitos-net]

  namenode:
    build:
      context: .
      dockerfile: docker/hadoop.Dockerfile
    image: delitos-hadoop:3.3.6
    container_name: delitos-namenode
    hostname: namenode
    command: ["namenode"]
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hdfs_name:/data/name
      - hdfs_tmp:/data/tmp
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9870/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [delitos-net]

  datanode:
    image: delitos-hadoop:3.3.6
    container_name: delitos-datanode
    hostname: datanode
    command: ["datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "9864:9864"
    volumes:
      - hdfs_data:/data/data
      - hdfs_tmp:/data/tmp
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9864/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [delitos-net]

  postgres:
    image: postgres:16-alpine
    container_name: delitos-postgres
    hostname: postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: delitos
      POSTGRES_USER: delitos
      POSTGRES_PASSWORD: delitos
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delitos -d delitos"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [delitos-net]

  spark:
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    image: delitos-pipeline:3.5.1
    container_name: delitos-spark
    hostname: spark
    user: "1000:1000"
    environment:
      HOME: /home/spark
      KAFKA_BOOTSTRAP: kafka:9092
      HDFS_URI: hdfs://namenode:9000
      WEBHDFS_URL: http://namenode:9870/webhdfs/v1
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: delitos
      PGUSER: delitos
      PGPASSWORD: delitos
    depends_on:
      kafka:
        condition: service_healthy
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --ServerApp.token=
      - --ServerApp.password=
      - --ServerApp.allow_root=True
    networks: [delitos-net]

  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit.Dockerfile
    image: delitos-streamlit:1.0
    container_name: delitos-streamlit
    hostname: streamlit
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: delitos
      PGUSER: delitos
      PGPASSWORD: delitos
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    networks: [delitos-net]

volumes:
  hdfs_name:
  hdfs_data:
  hdfs_tmp:
  pgdata:

networks:
  delitos-net:
    driver: bridge
